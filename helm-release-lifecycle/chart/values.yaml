replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.29-alpine"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  environment: development
  managed-by: helm

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: http

application:
  title: Helm-Managed Web Delivery
  heading: Welcome to the Helm-managed application
  message: This page is rendered from a Kubernetes ConfigMap.
  environment: development

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

revisionHistoryLimit: 3

nodeSelector: {}

tolerations: []

affinity: {}
