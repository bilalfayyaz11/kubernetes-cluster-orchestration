apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web-delivery.fullname" . }}-content
  labels:
    {{- include "web-delivery.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{{ .Values.application.title }}</title>
    </head>
    <body>
      <main>
        <h1>{{ .Values.application.heading }}</h1>
        <p>{{ .Values.application.message }}</p>
        <p>Environment: {{ .Values.application.environment }}</p>
        <p>Chart: {{ .Chart.Name }} {{ .Chart.Version }}</p>
        <p>Application version: {{ .Chart.AppVersion }}</p>
        <p>Release: {{ .Release.Name }}</p>
      </main>
    </body>
    </html>
